<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 48" width="100%" height="100%">
  <defs>
    <linearGradient id="c-cyan-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#42DDF5" />
      <stop offset="100%" stop-color="#1D4ED8" />
    </linearGradient>
    <linearGradient id="c-amber-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFF3B0" />
      <stop offset="50%" stop-color="#FBBF24" />
      <stop offset="100%" stop-color="#D97706" />
    </linearGradient>
    <linearGradient id="c-limb-grad" x1="0%" y1="0%" x2="100%" y2="80%">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.95" />
      <stop offset="50%" stop-color="#BAE6FD" stop-opacity="0.7" />
      <stop offset="100%" stop-color="#0284C7" stop-opacity="0" />
    </linearGradient>
    <filter id="c-glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="1" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Scaled Emblem at left (40x40 at x=4, y=4) -->
  <g transform="translate(4, 4) scale(0.333)">
    <!-- Base calibration rings -->
    <circle cx="60" cy="60" r="54" fill="none" stroke="rgba(66, 221, 245, 0.3)" stroke-width="1.5" stroke-dasharray="4 4" />
    <circle cx="60" cy="60" r="44" fill="none" stroke="rgba(120, 174, 255, 0.25)" stroke-width="1" />

    <!-- Cardinal Ticks -->
    <line x1="60" y1="2" x2="60" y2="12" stroke="#42DDF5" stroke-width="2.5" stroke-linecap="round" />
    <line x1="60" y1="108" x2="60" y2="118" stroke="#FBBF24" stroke-width="3" stroke-linecap="round" />
    <line x1="108" y1="60" x2="118" y2="60" stroke="#42DDF5" stroke-width="2.5" stroke-linecap="round" />
    <line x1="2" y1="60" x2="12" y2="60" stroke="#42DDF5" stroke-width="2.5" stroke-linecap="round" />

    <!-- Lunar Crescent Limb -->
    <path d="M 60 14 A 46 46 0 0 1 106 60 A 46 46 0 0 1 60 106 C 82 92 92 74 92 60 C 92 46 82 28 60 14 Z"
          fill="url(#c-limb-grad)" filter="url(#c-glow)" />

    <!-- Crosshair Lines -->
    <line x1="18" y1="60" x2="48" y2="60" stroke="#42DDF5" stroke-width="1.5" stroke-linecap="round" stroke-opacity="0.8" />
    <line x1="72" y1="60" x2="102" y2="60" stroke="#42DDF5" stroke-width="1.5" stroke-linecap="round" stroke-opacity="0.8" />
    <line x1="60" y1="18" x2="60" y2="48" stroke="#42DDF5" stroke-width="1.5" stroke-linecap="round" stroke-opacity="0.8" />
    <line x1="60" y1="72" x2="60" y2="102" stroke="#42DDF5" stroke-width="1.5" stroke-linecap="round" stroke-opacity="0.8" />

    <!-- Central Precision Reticle -->
    <circle cx="60" cy="60" r="18" fill="none" stroke="#42DDF5" stroke-width="1.8" stroke-dasharray="8 6" />

    <!-- Descent Trajectory Vector -->
    <path d="M 18 28 Q 38 18, 54 36 T 60 60"
          fill="none" stroke="#42DDF5" stroke-width="2.8" stroke-linecap="round" />

    <!-- Amber Landing Beacon Star -->
    <path d="M 60 48 L 63.5 56.5 L 72 60 L 63.5 63.5 L 60 72 L 56.5 63.5 L 48 60 L 56.5 56.5 Z"
          fill="url(#c-amber-grad)" />
    <circle cx="60" cy="60" r="2.5" fill="#FFFFFF" />
  </g>

  <!-- Brand Typography -->
  <g transform="translate(52, 25)">
    <text font-family="-apple-system, BlinkMacSystemFont, 'Inter', 'Segoe UI', system-ui, sans-serif"
          font-size="22"
          line-height="1">
      <tspan fill="#FFFFFF" font-weight="300" letter-spacing="0.16em">LUNA</tspan>
      <tspan dx="2" fill="#42DDF5" font-weight="900" letter-spacing="0.1em" filter="url(#c-glow)">OPS</tspan>
    </text>

    <!-- Geodetic Mini-Tag -->
    <rect x="135" y="-14" width="68" height="12" rx="6" fill="rgba(66, 221, 245, 0.08)" stroke="rgba(66, 221, 245, 0.28)" stroke-width="0.7" />
    <text x="169" y="-5.5"
          font-family="'JetBrains Mono', 'SF Mono', monospace"
          font-size="6.5"
          font-weight="700"
          letter-spacing="0.08em"
          fill="#42DDF5"
          text-anchor="middle">MOON_ME</text>
  </g>

  <!-- Clear Website Motto: Explore the lunar frontier · Plan with precision -->
  <g transform="translate(52, 39)">
    <text font-family="-apple-system, BlinkMacSystemFont, 'Inter', 'Segoe UI', system-ui, sans-serif"
          font-size="7.5"
          letter-spacing="0.14em">
      <tspan fill="#94A3B8" font-weight="500">EXPLORE FRONTIER</tspan>
      <tspan fill="#38BDF8" font-weight="700"> &#183; </tspan>
      <tspan fill="#42DDF5" font-weight="700">PLAN WITH PRECISION</tspan>
    </text>
  </g>
</svg>

