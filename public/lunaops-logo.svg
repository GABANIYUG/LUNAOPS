<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 540 96" width="100%" height="100%">
  <defs>
    <!-- Gradients -->
    <linearGradient id="logo-cyan-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#42DDF5" />
      <stop offset="50%" stop-color="#38BDF8" />
      <stop offset="100%" stop-color="#1D4ED8" />
    </linearGradient>

    <linearGradient id="logo-amber-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFF3B0" />
      <stop offset="40%" stop-color="#FBBF24" />
      <stop offset="100%" stop-color="#D97706" />
    </linearGradient>

    <linearGradient id="logo-limb-grad" x1="0%" y1="0%" x2="100%" y2="80%">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.95" />
      <stop offset="45%" stop-color="#BAE6FD" stop-opacity="0.75" />
      <stop offset="85%" stop-color="#38BDF8" stop-opacity="0.25" />
      <stop offset="100%" stop-color="#0284C7" stop-opacity="0" />
    </linearGradient>

    <linearGradient id="logo-traj-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#42DDF5" stop-opacity="0.1" />
      <stop offset="60%" stop-color="#42DDF5" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#FBBF24" stop-opacity="1" />
    </linearGradient>

    <linearGradient id="divider-grad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#42DDF5" stop-opacity="0.8" />
      <stop offset="40%" stop-color="#38BDF8" stop-opacity="0.4" />
      <stop offset="80%" stop-color="#78AEFF" stop-opacity="0.2" />
      <stop offset="100%" stop-color="#78AEFF" stop-opacity="0" />
    </linearGradient>

    <radialGradient id="logo-beacon-glow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#FBBF24" stop-opacity="0.6" />
      <stop offset="50%" stop-color="#F59E0B" stop-opacity="0.2" />
      <stop offset="100%" stop-color="#F59E0B" stop-opacity="0" />
    </radialGradient>

    <!-- Tech glow filter -->
    <filter id="logo-glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="1.5" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>

    <filter id="logo-beacon-filter" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur in="SourceGraphic" stdDeviation="1.2" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <!-- ==================== EMBLEM (Left, scaled inside 84x84 box at x=6, y=6) ==================== -->
  <g transform="translate(6, 6) scale(0.7)">
    <!-- Base calibration rings -->
    <circle cx="60" cy="60" r="54" fill="none" stroke="rgba(66, 221, 245, 0.25)" stroke-width="1" stroke-dasharray="3 3" />
    <circle cx="60" cy="60" r="46" fill="none" stroke="rgba(120, 174, 255, 0.2)" stroke-width="0.8" />
    <circle cx="60" cy="60" r="34" fill="none" stroke="rgba(66, 221, 245, 0.15)" stroke-width="0.8" stroke-dasharray="2 4" />

    <!-- Calibration ticks -->
    <line x1="60" y1="4" x2="60" y2="11" stroke="#42DDF5" stroke-width="1.8" stroke-linecap="round" />
    <line x1="60" y1="109" x2="60" y2="116" stroke="#FBBF24" stroke-width="2.2" stroke-linecap="round" />
    <line x1="109" y1="60" x2="116" y2="60" stroke="#42DDF5" stroke-width="1.8" stroke-linecap="round" />
    <line x1="4" y1="60" x2="11" y2="60" stroke="#42DDF5" stroke-width="1.8" stroke-linecap="round" />

    <!-- Sub-ticks -->
    <line x1="88" y1="16" x2="85" y2="21" stroke="rgba(66, 221, 245, 0.45)" stroke-width="1" />
    <line x1="104" y1="32" x2="99" y2="35" stroke="rgba(66, 221, 245, 0.45)" stroke-width="1" />
    <line x1="104" y1="88" x2="99" y2="85" stroke="rgba(66, 221, 245, 0.45)" stroke-width="1" />
    <line x1="88" y1="104" x2="85" y2="99" stroke="rgba(66, 221, 245, 0.45)" stroke-width="1" />
    <line x1="32" y1="104" x2="35" y2="99" stroke="rgba(66, 221, 245, 0.45)" stroke-width="1" />
    <line x1="16" y1="88" x2="21" y2="85" stroke="rgba(66, 221, 245, 0.45)" stroke-width="1" />
    <line x1="16" y1="32" x2="21" y2="35" stroke="rgba(66, 221, 245, 0.45)" stroke-width="1" />
    <line x1="32" y1="16" x2="35" y2="21" stroke="rgba(66, 221, 245, 0.45)" stroke-width="1" />

    <!-- Lunar South Pole Limb Curve -->
    <path d="M 60 14 A 46 46 0 0 1 106 60 A 46 46 0 0 1 60 106 C 82 92 92 74 92 60 C 92 46 82 28 60 14 Z"
          fill="url(#logo-limb-grad)" filter="url(#logo-glow)" />

    <!-- Precision Crosshairs -->
    <line x1="18" y1="60" x2="48" y2="60" stroke="#42DDF5" stroke-width="1" stroke-linecap="round" stroke-opacity="0.7" />
    <line x1="72" y1="60" x2="102" y2="60" stroke="#42DDF5" stroke-width="1" stroke-linecap="round" stroke-opacity="0.7" />
    <line x1="60" y1="18" x2="60" y2="48" stroke="#42DDF5" stroke-width="1" stroke-linecap="round" stroke-opacity="0.7" />
    <line x1="60" y1="72" x2="60" y2="102" stroke="#42DDF5" stroke-width="1" stroke-linecap="round" stroke-opacity="0.7" />

    <!-- Polar Reticle Center -->
    <circle cx="60" cy="60" r="18" fill="none" stroke="#42DDF5" stroke-width="1.2" stroke-opacity="0.85" stroke-dasharray="8 6" />

    <!-- Descent Trajectory Vector -->
    <path d="M 18 28 Q 38 18, 54 36 T 60 60"
          fill="none" stroke="url(#logo-traj-grad)" stroke-width="2.2" stroke-linecap="round" />

    <!-- Landing Target Ping -->
    <circle cx="60" cy="60" r="24" fill="url(#logo-beacon-glow)" />
    <circle cx="60" cy="60" r="8" fill="none" stroke="#FBBF24" stroke-width="0.8" stroke-opacity="0.5" />

    <!-- Artemis Amber Beacon ("Peaks of Eternal Light") -->
    <g filter="url(#logo-beacon-filter)">
      <path d="M 60 49 L 62.8 57.2 L 71 60 L 62.8 62.8 L 60 71 L 57.2 62.8 L 49 60 L 57.2 57.2 Z"
            fill="url(#logo-amber-grad)" />
      <circle cx="60" cy="60" r="2" fill="#FFFFFF" />
    </g>
  </g>

  <!-- ==================== BRANDING & WORDMARK ==================== -->
  <!-- Top Kicker Pedigree -->
  <g transform="translate(100, 24)">
    <circle cx="4" cy="-3.5" r="2.5" fill="#42DDF5">
      <animate attributeName="opacity" values="1;0.4;1" dur="3s" repeatCount="indefinite" />
    </circle>
    <text x="14" y="0"
          font-family="'JetBrains Mono', 'SF Mono', 'Segoe UI Mono', monospace"
          font-size="9"
          font-weight="600"
          letter-spacing="0.22em"
          fill="#78AEFF">NASA SPACE APPS 2026 &middot; SELENE LABS</text>

    <!-- Geodetic Reference Pill -->
    <rect x="312" y="-9" width="102" height="14" rx="7" fill="rgba(66, 221, 245, 0.08)" stroke="rgba(66, 221, 245, 0.3)" stroke-width="0.75" />
    <text x="363" y="1.5"
          font-family="'JetBrains Mono', 'SF Mono', 'Segoe UI Mono', monospace"
          font-size="7.5"
          font-weight="700"
          letter-spacing="0.1em"
          fill="#42DDF5"
          text-anchor="middle">IAU MOON_ME</text>
  </g>

  <!-- Primary Wordmark: LUNAOPS -->
  <g transform="translate(100, 59)">
    <text font-family="-apple-system, BlinkMacSystemFont, 'Inter', 'Segoe UI', system-ui, sans-serif"
          font-size="34"
          line-height="1">
      <!-- LUNA -->
      <tspan fill="#FFFFFF" font-weight="300" letter-spacing="0.18em">LUNA</tspan>
      <!-- OPS -->
      <tspan dx="4" fill="#42DDF5" font-weight="900" letter-spacing="0.12em" filter="url(#logo-glow)">OPS</tspan>
    </text>

    <!-- Subtle Mission Version Tag -->
    <text x="246" y="-3"
          font-family="'JetBrains Mono', 'SF Mono', 'Segoe UI Mono', monospace"
          font-size="8.5"
          font-weight="600"
          letter-spacing="0.14em"
          fill="#38BDF8"
          opacity="0.8">v2.4 &middot; POLAR</text>
  </g>

  <!-- Precision Accent Divider Line -->
  <line x1="100" y1="69" x2="520" y2="69" stroke="url(#divider-grad)" stroke-width="1.2" />

  <!-- The Clear Website Motto: Explore the lunar frontier · Plan with precision -->
  <g transform="translate(100, 84)">
    <text font-family="-apple-system, BlinkMacSystemFont, 'Inter', 'Segoe UI', system-ui, sans-serif"
          font-size="9.5"
          letter-spacing="0.16em">
      <tspan fill="#94A3B8" font-weight="500">EXPLORE THE LUNAR FRONTIER</tspan>
      <tspan fill="#38BDF8" font-weight="700"> &middot; </tspan>
      <tspan fill="#42DDF5" font-weight="700">PLAN WITH PRECISION</tspan>
    </text>
  </g>
</svg>
