<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" width="32" height="32">
  <defs>
    <radialGradient id="fav-bg" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#051326" />
      <stop offset="100%" stop-color="#01050A" />
    </radialGradient>
    <linearGradient id="fav-limb" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" />
      <stop offset="50%" stop-color="#BAE6FD" />
      <stop offset="100%" stop-color="#0284C7" stop-opacity="0.3" />
    </linearGradient>
    <linearGradient id="fav-amber" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFF3B0" />
      <stop offset="60%" stop-color="#FBBF24" />
      <stop offset="100%" stop-color="#D97706" />
    </linearGradient>
  </defs>

  <!-- Deep space base disc -->
  <circle cx="16" cy="16" r="15" fill="url(#fav-bg)" stroke="#42DDF5" stroke-width="1" stroke-opacity="0.5" />

  <!-- Geodetic Outer Reticle Ring -->
  <circle cx="16" cy="16" r="12" fill="none" stroke="#42DDF5" stroke-width="0.8" stroke-dasharray="2 2" stroke-opacity="0.6" />

  <!-- Cardinal alignment ticks -->
  <line x1="16" y1="2" x2="16" y2="4.5" stroke="#42DDF5" stroke-width="1.2" stroke-linecap="round" />
  <line x1="16" y1="27.5" x2="16" y2="30" stroke="#FBBF24" stroke-width="1.5" stroke-linecap="round" />
  <line x1="2" y1="16" x2="4.5" y2="16" stroke="#42DDF5" stroke-width="1.2" stroke-linecap="round" />
  <line x1="27.5" y1="16" x2="30" y2="16" stroke="#42DDF5" stroke-width="1.2" stroke-linecap="round" />

  <!-- Crescent Lunar South Pole Limb -->
  <path d="M 16 4 A 12 12 0 0 1 28 16 A 12 12 0 0 1 16 28 C 22 24 25 19 25 16 C 25 13 22 8 16 4 Z"
        fill="url(#fav-limb)" />

  <!-- Crosshair axes -->
  <line x1="6" y1="16" x2="12" y2="16" stroke="#42DDF5" stroke-width="0.8" stroke-opacity="0.8" />
  <line x1="20" y1="16" x2="26" y2="16" stroke="#42DDF5" stroke-width="0.8" stroke-opacity="0.8" />
  <line x1="16" y1="6" x2="16" y2="12" stroke="#42DDF5" stroke-width="0.8" stroke-opacity="0.8" />
  <line x1="16" y1="20" x2="16" y2="26" stroke="#42DDF5" stroke-width="0.8" stroke-opacity="0.8" />

  <!-- Precision Center Reticle -->
  <circle cx="16" cy="16" r="4.5" fill="none" stroke="#42DDF5" stroke-width="0.9" />

  <!-- Artemis Landing Beacon: 4-Point Amber Diamond -->
  <path d="M 16 11.5 L 17.5 14.5 L 20.5 16 L 17.5 17.5 L 16 20.5 L 14.5 17.5 L 11.5 16 L 14.5 14.5 Z"
        fill="url(#fav-amber)" />
  <circle cx="16" cy="16" r="1.2" fill="#FFFFFF" />
</svg>
