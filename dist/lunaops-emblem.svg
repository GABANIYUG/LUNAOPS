<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" width="100%" height="100%">
  <defs>
    <!-- Gradients -->
    <linearGradient id="luna-cyan-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#42DDF5" />
      <stop offset="50%" stop-color="#38BDF8" />
      <stop offset="100%" stop-color="#1D4ED8" />
    </linearGradient>

    <linearGradient id="luna-amber-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFF3B0" />
      <stop offset="40%" stop-color="#FBBF24" />
      <stop offset="100%" stop-color="#D97706" />
    </linearGradient>

    <linearGradient id="luna-limb-grad" x1="0%" y1="0%" x2="100%" y2="80%">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.95" />
      <stop offset="45%" stop-color="#BAE6FD" stop-opacity="0.75" />
      <stop offset="85%" stop-color="#38BDF8" stop-opacity="0.2" />
      <stop offset="100%" stop-color="#0284C7" stop-opacity="0" />
    </linearGradient>

    <linearGradient id="traj-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#42DDF5" stop-opacity="0.1" />
      <stop offset="60%" stop-color="#42DDF5" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#FBBF24" stop-opacity="1" />
    </linearGradient>

    <radialGradient id="beacon-glow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#FBBF24" stop-opacity="0.6" />
      <stop offset="40%" stop-color="#F59E0B" stop-opacity="0.25" />
      <stop offset="100%" stop-color="#F59E0B" stop-opacity="0" />
    </radialGradient>

    <radialGradient id="center-dark" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#040D1A" stop-opacity="0.9" />
      <stop offset="75%" stop-color="#020813" stop-opacity="0.95" />
      <stop offset="100%" stop-color="#01040A" stop-opacity="1" />
    </radialGradient>

    <!-- Filter for soft tech glow -->
    <filter id="cyan-glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="2" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>

    <filter id="beacon-filter" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur in="SourceGraphic" stdDeviation="1.5" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <!-- Background disc for contrast in standalone view -->
  <circle cx="60" cy="60" r="58" fill="url(#center-dark)" stroke="rgba(66, 221, 245, 0.15)" stroke-width="1" />

  <!-- Outer Geodetic Calibration Ring (USGS Polar Stereo grid aesthetic) -->
  <circle cx="60" cy="60" r="52" fill="none" stroke="rgba(66, 221, 245, 0.22)" stroke-width="1" stroke-dasharray="2 3" />
  <circle cx="60" cy="60" r="46" fill="none" stroke="rgba(120, 174, 255, 0.18)" stroke-width="0.75" />
  <circle cx="60" cy="60" r="34" fill="none" stroke="rgba(66, 221, 245, 0.12)" stroke-width="0.75" stroke-dasharray="1 4" />

  <!-- Geodetic Cardinal & Intermediate Calibration Ticks -->
  <!-- 0 deg / North (top) -->
  <line x1="60" y1="6" x2="60" y2="12" stroke="#42DDF5" stroke-width="1.5" stroke-linecap="round" />
  <!-- 180 deg / South (bottom - focal axis) -->
  <line x1="60" y1="108" x2="60" y2="114" stroke="#FBBF24" stroke-width="2" stroke-linecap="round" />
  <!-- 90 deg / East (right) -->
  <line x1="108" y1="60" x2="114" y2="60" stroke="#42DDF5" stroke-width="1.5" stroke-linecap="round" />
  <!-- 270 deg / West (left) -->
  <line x1="6" y1="60" x2="12" y2="60" stroke="#42DDF5" stroke-width="1.5" stroke-linecap="round" />

  <!-- Minor 30-deg ticks -->
  <line x1="86" y1="15" x2="83" y2="20" stroke="rgba(66, 221, 245, 0.4)" stroke-width="1" />
  <line x1="105" y1="34" x2="100" y2="37" stroke="rgba(66, 221, 245, 0.4)" stroke-width="1" />
  <line x1="105" y1="86" x2="100" y2="83" stroke="rgba(66, 221, 245, 0.4)" stroke-width="1" />
  <line x1="86" y1="105" x2="83" y2="100" stroke="rgba(66, 221, 245, 0.4)" stroke-width="1" />
  <line x1="34" y1="105" x2="37" y2="100" stroke="rgba(66, 221, 245, 0.4)" stroke-width="1" />
  <line x1="15" y1="86" x2="20" y2="83" stroke="rgba(66, 221, 245, 0.4)" stroke-width="1" />
  <line x1="15" y1="34" x2="20" y2="37" stroke="rgba(66, 221, 245, 0.4)" stroke-width="1" />
  <line x1="34" y1="15" x2="37" y2="20" stroke="rgba(66, 221, 245, 0.4)" stroke-width="1" />

  <!-- The Lunar South Pole Limb & Crater Rim Silhouette (Precision Lunar Topography) -->
  <!-- Sweeping illuminated crescent limb of the Moon -->
  <path d="M 60 14 A 46 46 0 0 1 106 60 A 46 46 0 0 1 60 106 C 82 92 92 74 92 60 C 92 46 82 28 60 14 Z"
        fill="url(#luna-limb-grad)" filter="url(#cyan-glow)" />

  <!-- Topographic crater rim contour arcs (Shackleton / de Gerlache / Malapert hints) -->
  <path d="M 44 68 C 48 64 56 63 62 67 C 68 71 67 78 61 80 C 55 82 46 76 44 68 Z"
        fill="none" stroke="rgba(66, 221, 245, 0.35)" stroke-width="1" stroke-dasharray="1.5 2" />
  <path d="M 68 45 C 72 42 79 43 82 48 C 85 53 82 58 77 58 C 72 58 67 52 68 45 Z"
        fill="none" stroke="rgba(66, 221, 245, 0.25)" stroke-width="0.8" />

  <!-- Precision Targeting Crosshair Grid (The "Plan With Precision" reticle) -->
  <line x1="20" y1="60" x2="48" y2="60" stroke="#42DDF5" stroke-width="1" stroke-linecap="round" stroke-opacity="0.6" />
  <line x1="72" y1="60" x2="100" y2="60" stroke="#42DDF5" stroke-width="1" stroke-linecap="round" stroke-opacity="0.6" />
  <line x1="60" y1="20" x2="60" y2="48" stroke="#42DDF5" stroke-width="1" stroke-linecap="round" stroke-opacity="0.6" />
  <line x1="60" y1="72" x2="60" y2="100" stroke="#42DDF5" stroke-width="1" stroke-linecap="round" stroke-opacity="0.6" />

  <!-- Concentric Precision Target Ring with tick segments -->
  <circle cx="60" cy="60" r="18" fill="none" stroke="#42DDF5" stroke-width="1.2" stroke-opacity="0.8" stroke-dasharray="8 6" />

  <!-- Artemis Mission Descent Trajectory Arc (Precision descent vector from orbital insertion to South Pole) -->
  <path d="M 18 28 Q 38 18, 54 36 T 60 60"
        fill="none" stroke="url(#traj-grad)" stroke-width="2" stroke-linecap="round" stroke-dasharray="60" stroke-dashoffset="0" />

  <!-- Lidar radar pulse ripples from landing target site -->
  <circle cx="60" cy="60" r="8" fill="none" stroke="#FBBF24" stroke-width="0.75" stroke-opacity="0.4" />
  <circle cx="60" cy="60" r="26" fill="url(#beacon-glow)" />

  <!-- The Precision Landing Beacon (Amber 4-point Diamond Star - "Peaks of Eternal Light") -->
  <!-- Radiating diamond representing pinpoint precision landing and solar illumination -->
  <g filter="url(#beacon-filter)">
    <!-- 4-point star -->
    <path d="M 60 49 L 62.8 57.2 L 71 60 L 62.8 62.8 L 60 71 L 57.2 62.8 L 49 60 L 57.2 57.2 Z"
          fill="url(#luna-amber-grad)" />
    <!-- Center core nucleus -->
    <circle cx="60" cy="60" r="2" fill="#FFFFFF" />
  </g>

  <!-- Fine micro-coordinates engraving: 90°S True South Pole Reference -->
  <text x="60" y="104" font-family="'JetBrains Mono', 'SF Mono', 'Segoe UI Mono', monospace" font-size="5"
        font-weight="700" fill="#42DDF5" text-anchor="middle" letter-spacing="1">90°S · POLAR</text>
</svg>
